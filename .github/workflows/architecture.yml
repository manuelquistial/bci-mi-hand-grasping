name: architecture

on:
  push:
  pull_request:

jobs:
  gates:
    name: Offline gates (line budget + online->service ban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run architecture gates
        run: bash scripts/check_architecture.sh

  pipeline:
    name: Pipeline architecture tests
    runs-on: ubuntu-latest
    needs: gates
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pytest tests/test_architecture.py tests/test_contract_schemas.py tests/test_marker_wire_contract.py -q

  simulator:
    name: Simulator tests
    runs-on: ubuntu-latest
    needs: gates
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups
      - run: uv run pytest -q

  game:
    name: Game tests
    runs-on: ubuntu-latest
    needs: gates
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
