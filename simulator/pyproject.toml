[project]
name = "simopenbci"
version = "0.1.0"
description = "Stream EEG datasets to Lab Streaming Layer (LSL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15.0",
    "pylsl>=1.16.0",
]

[project.scripts]
simopenbci = "simopenbci.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simopenbci", "dataset_loaders"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
